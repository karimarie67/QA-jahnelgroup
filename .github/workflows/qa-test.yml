name: QA Test Suite

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  # A nightly run, for monitoring a live site. Off in the template (its sites
  # are placeholders); /new-engagement step 5 turns it on, together with the
  # e2e jobs' and update-dashboard's `if:` (see their comments). GitHub runs a
  # schedule from the default branch only, emails the person who last changed
  # the cron when a run fails, and disables it after 60 days with no activity
  # in a public repo.
  # schedule:
  #   - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - smoke
          - regression
          - links
          - all

# A dispatch picks the environment; a push, a PR, or a scheduled run uses
# staging. To monitor production on the schedule instead:
#   TEST_ENV: ${{ github.event.inputs.environment || (github.event_name == 'schedule' && 'production') || 'staging' }}
env:
  TEST_ENV: ${{ github.event.inputs.environment || 'staging' }}

jobs:
  # The browser e2e jobs run on every push and PR, and on dispatch
  # (/new-engagement step 5: this Engagement's Site config is real). They test
  # the live site (there's no staging copy): read-only, one worker
  # (playwright.config.js). A test that fails on a known site defect stays red
  # (the human's choice, docs/engagement-log.md step 8).
  # Each job runs the desktop and phone projects together, and selects its
  # tests by suite tag (@smoke, @regression), so a new spec needs no edit
  # here; scripts/tag-check.js (in template-check) holds the tag rules. A job
  # whose tag matches no test fails ("No tests found"): drop the job with its
  # last test.
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Smoke Tests (Quick Validation)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.test_suite == 'smoke' || github.event.inputs.test_suite == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # A failing test fails its job, so a real failure shows as a red check.
      # The steps after this one still run (if: always()) and collect the
      # results for the dashboard.
      - name: Run Smoke Tests
        run: npx playwright test --grep @smoke --project=${{ env.TEST_ENV }} --project=${{ env.TEST_ENV }}-mobile

      - name: Organize results for dashboard
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/smoke-test-results
          echo "Checking for test-results.json..."
          if [ -f "test-results.json" ]; then
            echo "✓ Found test-results.json, copying to smoke-results.json"
            cp test-results.json artifacts/smoke-test-results/smoke-results.json
          else
            echo "✗ test-results.json not found"
            ls -la
          fi
          if [ -d "playwright-report" ]; then
            echo "✓ Copying playwright-report"
            cp -r playwright-report artifacts/smoke-test-results/
          fi
          if [ -d "playwright-output" ]; then
            echo "✓ Copying playwright-output directory"
            cp -r playwright-output artifacts/smoke-test-results/
          fi

      - name: Upload Smoke Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: artifacts/smoke-test-results/
          retention-days: 30
          if-no-files-found: warn

  functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Functional Tests (@regression)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.test_suite == 'regression' || github.event.inputs.test_suite == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Every @regression test, desktop and phone, into one JSON file for the
      # dashboard. The logged-in specs run on the -auth projects, after the
      # login (<env>-setup), which runs whatever the grep. The
      # login secrets are passed to this step only. A PR from a fork or
      # Dependabot gets no secrets, so its login skips; a same-repo run
      # without them fails. Never add a retries flag here: it would override the
      # login's no-retry rule and could lock a real account out.
      - name: Run Functional Tests
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_PR_WITHOUT_SECRETS: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=test-results.json npx playwright test --grep @regression --project=${{ env.TEST_ENV }} --project=${{ env.TEST_ENV }}-mobile --project=${{ env.TEST_ENV }}-auth --project=${{ env.TEST_ENV }}-auth-mobile --reporter=json

      - name: Organize results for dashboard
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/functional-test-results
          if [ -f "test-results.json" ]; then
            cp test-results.json artifacts/functional-test-results/functional-results.json
          else
            echo "No test-results.json found!"
          fi
          if [ -d "playwright-report" ]; then
            cp -r playwright-report artifacts/functional-test-results/
          fi
          if [ -d "playwright-output" ]; then
            cp -r playwright-output artifacts/functional-test-results/
          fi

      - name: Upload Functional Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results
          path: artifacts/functional-test-results/
          retention-days: 30
          if-no-files-found: warn

  # On demand only: the link checker isn't part of the push and PR gate, and
  # its results don't go to the dashboard. To crawl on the schedule too (a
  # crawl is long; weekly may suit better than nightly), add
  # `|| github.event_name == 'schedule'` to its `if:`.
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Link Check
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_suite == 'links' || github.event.inputs.test_suite == 'all')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Link Check
        run: npm run test:links

      - name: Upload Link Check Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-check-results
          path: playwright-output/link-check/
          retention-days: 30
          if-no-files-found: warn

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  # ESLint (eslint.config.js) over the template's JavaScript, on every push and
  # PR: fails on any error or warning. Not a test result, so not part of the
  # dashboard.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  template-check:
    runs-on: ubuntu-latest
    name: Template Structural Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Template Structural Check
        run: npm run test:template-check

      - name: Check coverage map is current
        run: |
          npm run coverage
          if ! git diff --exit-code -- docs/coverage-map.md; then
            echo "::error::docs/coverage-map.md is out of date. Run 'npm run coverage' and commit the result."
            exit 1
          fi

  update-dashboard:
    runs-on: ubuntu-latest
    needs: [smoke-tests, functional-tests]
    # It commits to the branch that ran, so it must never run for a PR. It
    # runs on dispatch (not a links-only run, which has no results) and on a
    # push to main. With the schedule on, add `|| github.event_name == 'schedule'`
    # inside the outer parentheses (always() stays outside).
    if: always() && ((github.event_name == 'workflow_dispatch' && github.event.inputs.test_suite != 'links') || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    name: Update QA Dashboard
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: List downloaded artifacts for debugging
        run: |
          echo "=== Artifacts structure ==="
          ls -R ./artifacts 2>/dev/null || echo "No artifacts directory found"
          echo ""
          echo "=== Checking for specific result files ==="
          [ -f "./artifacts/smoke-test-results/smoke-results.json" ] && echo "✓ Found smoke-results.json" || echo "✗ Missing smoke-results.json"
          [ -f "./artifacts/functional-test-results/functional-results.json" ] && echo "✓ Found functional-results.json" || echo "✗ Missing functional-results.json"

      - name: Generate Dashboard
        run: |
          node dashboards/scripts/generate-dashboard.js
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF: ${{ github.ref }}

      - name: Commit Dashboard Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboards/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "📊 Update QA Dashboard - Run #${{ github.run_number }} [${{ github.ref_name }}]"
          # Another run (or a merge) may have pushed since checkout. Commit
          # first, then replay this commit on the latest branch; on a conflict
          # in the generated dashboard files, this run's output wins (-X theirs
          # during a rebase means the commit being replayed).
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin ${{ github.ref_name }} && git push && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the dashboard update after 3 attempts"
          exit 1
